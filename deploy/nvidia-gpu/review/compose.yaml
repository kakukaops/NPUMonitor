name: gpu-rule-review
services:
  review-simulator:
    image: python:3.12.9-slim
    command: [python, /app/thermal_links_simulator.py]
    volumes:
      - ../../../modules/devices/nvidia-gpu/rules/lab:/app:ro
      - ../../../modules/devices/nvidia-gpu/rules/monitoring/catalog:/queries:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9412/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 15
  review-prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:9090/-/ready']
      interval: 3s
      timeout: 3s
      retries: 15

global:
  scrape_interval: 5s
  evaluation_interval: 5s

# This Prometheus is isolated from any existing production Prometheus.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: gpu-simulator
    static_configs:
      - targets: ['gpu-simulator:9400']

  - job_name: h100-batch1-simulator
    metrics_path: /batch1/metrics
    track_timestamps_staleness: true
    static_configs:
      - targets: ['gpu-simulator:9400']
        labels:
          cluster_id: batch1-sim-lab

  - job_name: h100-comprehensive
    scrape_interval: 2s
    track_timestamps_staleness: true
    static_configs:
      - targets: ['comprehensive-source:9430']
        labels:
          cluster_id: h100-training-demo
  # Forward original Nightingale metrics unchanged through a fault-injection transport.
  - job_name: nightingale-self
    scrape_interval: 2s
    metrics_path: /nightingale/metrics
    static_configs:
      - targets: ['comprehensive-source:9430']

  # Isolated synthetic inputs and ML outputs; existing jobs are unchanged.
  - job_name: ml-anomaly-demo
    scrape_interval: 2s
    scrape_timeout: 2s
    static_configs:
      - targets: ['ml-anomaly-demo:9450']

  # Explicit GPU ML simulation profile; original jobs remain unchanged.
  - job_name: gpu-ml-simulation
    scrape_interval: 2s
    metrics_path: /simulation/metrics
    static_configs:
      - targets: ['gpu-ml:9460']

# Synthetic fixtures; expression must match catalog/rules.yaml. No live imports.
rule_files: []
evaluation_interval: 30s
tests:
- name: normal_zero
  interval: 30s
  input_series:
  - series: DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster_id="fixture-cluster",job="fixture-dcgm",instance="fixture-node:9400",UUID="GPU-FIXTURE-0000"}
    values: 0+0x20

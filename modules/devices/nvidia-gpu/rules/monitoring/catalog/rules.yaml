    reference_stack_id: h100-training-r595-20261106
    workload: training
    virtualization: disabled_user_confirmed
  binding:
    profile_id: h100-batch1-synthetic-review
    path: batch1-binding.yaml
    sha256: 6b3514f64979c483f895670ada478c01c298e5e01eef6636564983d5ad7f2f82
    production_admitted: false
  expression_language: promql
  expression: (label_replace(label_replace(label_replace(vector(1), "cluster_id", "fixture-cluster", "__name__", ".*"), "job",
    "dcgm", "__name__", ".*"), "instance", "fixture-node:9400", "__name__", ".*")) unless on(cluster_id,job,instance) ((up{cluster_id="fixture-cluster",job="dcgm"}
    == 1) and (((time() - timestamp(up{cluster_id="fixture-cluster",job="dcgm"})) >= 0) and ((time() - timestamp(up{cluster_id="fixture-cluster",job="dcgm"}))
    <= 90)))
  parameters:
    eval_interval_seconds:
      value: 30
      basis: engineering_review_value
    for_seconds:
      value: 60
      basis: engineering_review_value_not_yet_nightingale_tested
    max_sample_age_seconds:
      value: 90
      basis: engineering_assumption_30s_scrape
    binary_true_value:
      value: 1
      basis: quality_predicate
  severity:
    business: warning
    nightingale: 2
    basis: engineering_proposal
  identity:
  - cluster_id
  - job
  - instance
  lifecycle_semantics:
    firing: 预期采集目标缺失、up非1或采样时间无效/超龄
    condition_exit: 采集可达性恢复，不表示GPU硬件恢复
    missing_or_invalid: indeterminate_not_hardware_repair
    query_error: evaluation_error_requires_platform_observability
    administrative_close: not_hardware_repair
  notification:

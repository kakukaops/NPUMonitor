schema_version: 0.2.0
rules:
- rule_id: nvidia.ecc_dbe_new_errors
  version: 0.3.0
  name_zh: GPU近期新增不可纠正ECC错误
  category: hardware.memory.ecc
  lifecycle: draft
  default_policy: disabled
  owner: gpu-monitoring-maintainers
  documentation: ../rules/nvidia.ecc_dbe_new_errors.md
  coverage_target: nvidia.ecc_dbe_increment
  metric_ids:
  - nvidia.ecc_dbe_volatile_total
  applicability:
    entity: physical_gpu
    compatibility_status: unknown
    mig_status: unverified_not_admitted
    prerequisites:
    - ecc_supported_and_enabled
    - field_collected
    - one_series_per_device
    - stable_identity
    target_models:
    - H100
    hardware_profile_ids:
    - nvidia.h100.pcie
    - nvidia.h100.sxm
    - nvidia.h100.nvl
    hardware_compatibility:
    - profile_id: nvidia.h100.pcie
      model: H100
      variant: PCIe
      official_metric_support: unknown
      collection_validation: not_run
      real_cluster_validation: not_run
      evidence_source_ids: []
      open_evidence: field_and_semantics_on_this_h100_configuration
    - profile_id: nvidia.h100.sxm
      model: H100
      variant: SXM
      official_metric_support: unknown
      collection_validation: not_run
      real_cluster_validation: not_run
      evidence_source_ids: []
      open_evidence: field_and_semantics_on_this_h100_configuration
    - profile_id: nvidia.h100.nvl
      model: H100
      variant: NVL
      official_metric_support: unknown
      collection_validation: not_run
      real_cluster_validation: not_run
      evidence_source_ids: []
      open_evidence: field_and_semantics_on_this_h100_configuration
    model_admission: not_implemented_release_blocked
    reference_stack_id: h100-training-r595-20261106
    workload: training
    virtualization: disabled_user_confirmed
  expression_language: promql
  expression: '(increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster_id!="",UUID!=""}[5m]) > 0)

    and (min_over_time(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster_id!="",UUID!=""}[5m]) >= 0)

    and (max_over_time(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster_id!="",UUID!=""}[5m]) < 9223372036854775792)

    and (sum_over_time(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster_id!="",UUID!=""}[5m]) >= 0)

    and (count_over_time(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster_id!="",UUID!=""}[5m]) >= 2)

    and ((time() - timestamp(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{cluster_id!="",UUID!=""})) <= 90)'
  parameters:
    threshold:
      value: 0
      operator: '>'
      unit: errors
      basis: positive_increment_semantics
    window_seconds:
      value: 300
      basis: engineering_proposal
      configurable: true
    eval_interval_seconds:
      value: 30
      basis: engineering_proposal
      configurable: true
    for_seconds:
      value: 0
      basis: engineering_proposal_no_extra_delay
      configurable: true
    max_sample_age_seconds:
      value: 90
      basis: engineering_proposal_for_30s_scrape
      configurable: true
    min_window_samples:
      value: 2
      basis: minimum_to_estimate_counter_increase
      configurable: true
  severity:
    business: critical
    nightingale: 1
    basis: engineering_risk_classification
  identity:
  - cluster_id
  - UUID
  lifecycle_semantics:
    firing: positive_window_increase_with_valid_samples_and_fresh_current_sample
    condition_exit: no_recent_observed_increment_not_hardware_repair
    missing_or_invalid: indeterminate_require_companion_data_quality_signal
    stale: indeterminate_not_healthy
    query_error: evaluation_error_not_healthy
    reset: use_increase_counter_reset_semantics_not_hardware_repair
    administrative_close: not_hardware_repair
  notification:
    required_fields:
    - rule_id
    - version
    - cluster_id
    - UUID
    - observed_increase
    - window_seconds
    - event_time
    - end_reason
    firing_summary: GPU近期观测到不可纠正ECC计数新增，请核查设备和作业影响
    end_summary: 近期新增条件已退出，请核对数据质量；不代表硬件已修复
  dependencies:
    source_ids:
    - nvidia.exporter.counters
    - nvidia.dcgm.fields
    - nvidia.nvml.ecc
    - nvidia.dcgm.blank
    - prometheus.functions
    companion_rules: []
    companion_status: data_quality_and_missing_rules_required_but_not_yet_admitted
  tests:
    fixture: ../tests/ecc_dbe.promtool.yaml
    expression_tests: passed
    nightingale_tests: not_run
    real_cluster_tests: not_run
  release_blockers:
  - full_sample_and_parameter_review
  - real_hardware_compatibility_and_exporter_value_mapping
  - nightingale_firing_and_indeterminate_exit_semantics
  - companion_data_quality_rules_and_duplicate_series_checks
  - query_budget_and_actual_scrape_interval_validation
  - h100_variant_and_software_stack_admission

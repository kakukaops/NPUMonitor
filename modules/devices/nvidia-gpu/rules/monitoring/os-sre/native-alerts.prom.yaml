  - alert: os_sre_platform_query_failure
    expr: ((sum by (job,instance) (increase(n9e_alert_query_data_error_total{job=~"nightingale.*"}[300s]))
      > 0) and on (job,instance) (max by (job,instance) ((up{job=~"nightingale.*"}
      == 1) and ((time()-timestamp(up{job=~"nightingale.*"})) >= 0) and ((time()-timestamp(up{job=~"nightingale.*"}))
      <= 90))))
    for: 60s
    labels:
      severity: '1'
      monitoring_profile: os-sre
    annotations:
      summary: 平台-查询或评估失败
  - alert: os_sre_platform_evaluation_stall
    expr: ((((sum by (job,instance) (increase(n9e_alert_rule_eval_total{job=~"nightingale.*"}[300s]))
      == 0) and on (job,instance) (((sre:inventory:evaluation_expected == 1) and on
      (job,instance) (min by (job,instance) (count_over_time(n9e_alert_rule_eval_total{job=~"nightingale.*"}[300s]))
      >= 2))))) and on (job,instance) (max by (job,instance) ((up{job=~"nightingale.*"}
      == 1) and ((time()-timestamp(up{job=~"nightingale.*"})) >= 0) and ((time()-timestamp(up{job=~"nightingale.*"}))
      <= 90))))
    for: 60s
    labels:
      severity: '1'
      monitoring_profile: os-sre
    annotations:
      summary: 平台-评估调度停滞
  - alert: os_sre_platform_adapter_down
    expr: max by (job,instance) (up{job=~"gpu-lifecycle.*"} == 0)
    for: 60s
    labels:
      severity: '1'
      monitoring_profile: os-sre

rules:
  os_sre.sram:
    category: 内存与可靠性
    basis_kind: official_semantics_project_rule
    semantic_source_ids:
    - nvidia.dcgm.fixed_fields
    - nvidia.memory.sram
    official_support: 字段346定义threshold-exceeded布尔标志；SRAM管理文档说明诊断/RMA边界。
    project_criterion: 有效标志1触发、0提供解除观测；不以DBE总量直接决定换卡。
    parameter_ids: []
    limitations: 标志的目标设备清除行为未验证；触发不等于直接满足RMA。
    production_case_evidence: []
    real_hardware_validation: not_run
  os_sre.remap_failed:
    category: 内存与可靠性
    basis_kind: official_semantics_project_rule
    semantic_source_ids:
    - nvidia.dcgm.fixed_fields
    - nvidia.memory.statistics
    official_support: 字段395及官方row-remapping failure状态。
    project_criterion: 有效failure=1视作异常；0提供解除观测。
    parameter_ids: []
    limitations: 实际别名、标志清除和维护流程待现场验证。
    production_case_evidence: []
    real_hardware_validation: not_run
  os_sre.remap_pending:
    category: 内存与可靠性
    basis_kind: official_semantics_project_rule
    semantic_source_ids:
    - nvidia.dcgm.fixed_fields
    - nvidia.memory.statistics
    official_support: 字段396及官方row-remapping pending状态。
